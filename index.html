<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #d9eefb;
    --bg-bottom: #fdeadb;
    --ink: #1d2b3a;
    --muted: #46576a;
    --card: rgba(255,255,255,.7);
    --star: transparent;
    --coral: #f2594a;
    --blue: #2f84e0;
    --sun: #ffc21f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #141c3a;
      --bg-bottom: #3a2a52;
      --ink: #f3f0ff;
      --muted: #b9b4d6;
      --card: rgba(255,255,255,.08);
      --star: rgba(255,255,255,.85);
      --coral: #ff7a6c;
      --blue: #62aaf5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 70%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 62%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 30%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 6% 88%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 90%, var(--star) 50%, transparent 51%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    display: flex;
    align-items: center;
    padding: 2.5rem 0;
    padding-top: calc(2.5rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
  }
  main {
    width: min(100% - 2.5rem, 40rem);
    margin-inline: auto;
    text-align: center;
  }

  /* ---------- logo ---------- */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0 0 2rem;
  }
  .logo .mark {
    width: clamp(6rem, 24vw, 8.5rem);
    height: auto;
    animation: pop .9s cubic-bezier(.3,1.6,.5,1) both;
  }
  .logo .rays { transform-origin: 60px 60px; animation: spin 40s linear infinite; }
  .logo .word {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 600;
    font-size: clamp(3.2rem, 14vw, 6rem);
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0.4rem 0 0;
    animation: rise .8s .25s cubic-bezier(.2,.8,.3,1) both;
  }
  .logo .word .a { color: var(--coral); }
  .logo .word .b { color: var(--blue); }
  .logo .swoosh {
    width: clamp(9rem, 38vw, 14rem);
    height: auto;
    margin-top: 0.1rem;
    animation: rise .8s .45s cubic-bezier(.2,.8,.3,1) both;
  }

  /* ---------- text ---------- */
  h1 {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 5.5vw, 2.4rem);
    line-height: 1.15;
    margin: 0 0 0.75rem;
  }
  .lead { margin: 0 auto 2rem; max-width: 30rem; color: var(--muted); }
  .contact {
    display: inline-flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1.1rem 1.6rem;
    background: var(--card);
    border-radius: 18px;
    text-align: left;
  }
  .contact p { margin: 0; }
  .contact span { color: var(--muted); display: inline-block; min-width: 4.5rem; }
  a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }

  @keyframes pop  { from { opacity: 0; scale: .4; } }
  @keyframes rise { from { opacity: 0; translate: 0 14px; } }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) {
    .logo .mark, .logo .word, .logo .swoosh, .logo .rays { animation: none; }
  }
</style>
</head>
<body>

        <g class="rays" stroke="#ffc21f" stroke-width="8" stroke-linecap="round">

          <line x1="60" y1="6"  x2="60" y2="18" transform="rotate(315 60 60)" />

        <circle cx="49" cy="55" r="4.5" fill="#1d2b3a" />

        <circle cx="42" cy="67" r="5.5" fill="#ff7a8c" opacity=".55" />
        <circle cx="78" cy="67" r="5.5" fill="#ff7a8c" opacity=".55" />

      </svg>
      <p class="word" aria-hidden="true"><span class="a">little</span><span class="b">one</span></p>
      <svg class="swoosh" viewBox="0 0 200 14" aria-hidden="true">

      </svg>

    <h1>We're building something new</h1>

      <p><span>Email</span> <a href="mailto:rozanfirnaz@hotmail.com">rozanfirnaz@hotmail.com</a></p>

    </div>
  </main>
</body>
</html>
