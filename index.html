<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>littleone.com.lk | Under construction</title>
<meta name="description" content="littleone.com.lk is under construction. Please check back soon.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #d9eefb;
    --bg-bottom: #fdeadb;
    --ink: #1d2b3a;
    --muted: #46576a;
    --card: rgba(255,255,255,.7);
    --star: transparent;
    --moon: #ffe9a8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #141c3a;
      --bg-bottom: #3a2a52;
      --ink: #f3f0ff;
      --muted: #b9b4d6;
      --card: rgba(255,255,255,.08);
      --star: rgba(255,255,255,.85);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 12%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 70%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 62%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 30%, var(--star) 50%, transparent 51%),
      radial-gradient(2px 2px at 6% 88%, var(--star) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 90%, var(--star) 50%, transparent 51%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    display: flex;
    align-items: center;
    padding: 2.5rem 0;
    padding-top: calc(2.5rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px));
  }
  main {
    width: min(100% - 2.5rem, 40rem);
    margin-inline: auto;
    text-align: center;
  }
  .blocks {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 0.35rem;
    margin: 1.5rem 0 2.25rem;
    padding: 0;
    list-style: none;
  }
  .blocks li {
    position: relative;
    width: clamp(2rem, 8.5vw, 4.25rem);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 5.5vw, 2.7rem);
    color: #1d2b3a;
    border-radius: 28%;
    box-shadow: 0 5px 0 rgba(20,32,46,.22);
    transform: translateY(var(--y, 0)) rotate(var(--r, 0deg));
    transition: rotate .25s cubic-bezier(.3,1.6,.5,1), scale .25s cubic-bezier(.3,1.6,.5,1);
    animation: drop .8s cubic-bezier(.3,1.6,.5,1) both;
    animation-delay: calc(var(--i) * 90ms);
  }
  .blocks li:hover { rotate: 8deg; scale: 1.12; }
  .blocks li:nth-child(5n+1) { background: #ff8d7d; }
  .blocks li:nth-child(5n+2) { background: #ffd04d; }
  .blocks li:nth-child(5n+3) { background: #5fd3ac; }
  .blocks li:nth-child(5n+4) { background: #6fb4f8; }
  .blocks li:nth-child(5n)   { background: #b9a2fb; }
  .blocks li:nth-child(1) { --y: 0.2rem;  --r: -6deg; }
  .blocks li:nth-child(2) { --y: -0.9rem; --r: 5deg; width: clamp(1.7rem, 7vw, 3.5rem); }
  .blocks li:nth-child(3) { --y: 0.5rem;  --r: -3deg; }
  .blocks li:nth-child(4) { --y: -0.4rem; --r: 7deg; }
  .blocks li:nth-child(5) { --y: 0.1rem;  --r: -5deg; }
  .blocks li:nth-child(6) { --y: -0.7rem; --r: 4deg; }
  .blocks li:nth-child(7) { --y: 0.4rem;  --r: -4deg; border-radius: 50%; }
  .blocks li:nth-child(8) { --y: -0.5rem; --r: 6deg; }
  .blocks li:nth-child(9) { --y: 0.3rem;  --r: -7deg; }
  /* the star that dots the i */
  .blocks li.dot::before {
    content: "\2605";
    position: absolute;
    top: -0.95em;
    left: 50%;
    translate: -50% 0;
    font-size: 0.7em;
    color: #ff7aa8;
    text-shadow: 0 2px 0 rgba(20,32,46,.18);
  }
  /* the o is a smiling face */
  .blocks li.face::before {
    content: "";
    position: absolute;
    top: 33%;
    left: 29%;
    width: 0.17em;
    height: 0.17em;
    border-radius: 50%;
    background: #1d2b3a;
    box-shadow: 0.34em 0 0 #1d2b3a;
  }
  .blocks li.face::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% 0;
    width: 0.52em;
    height: 0.26em;
    border-bottom: 0.09em solid #1d2b3a;
    border-radius: 0 0 0.52em 0.52em;
  }
  h1 {
    font-family: "Fredoka", "Trebuchet MS", sans-serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 6vw, 2.75rem);
    line-height: 1.15;
    margin: 0 0 0.75rem;
  }
  .lead { margin: 0 auto 2rem; max-width: 30rem; color: var(--muted); }
  .contact {
    display: inline-flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1.1rem 1.6rem;
    background: var(--card);
    border-radius: 18px;
    text-align: left;
  }
  .contact p { margin: 0; }
  .contact span { color: var(--muted); display: inline-block; min-width: 4.5rem; }
  a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
  a:focus-visible { outline: 3px solid #6fb4f8; outline-offset: 3px; border-radius: 4px; }
  .moon {
    position: fixed;
    top: calc(1.5rem + env(safe-area-inset-top, 0px));
    right: 1.5rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    box-shadow: inset -14px 0 0 0 var(--moon);
    opacity: 0;
  }
  @media (prefers-color-scheme: dark) { .moon { opacity: .9; } }
  @keyframes drop { from { opacity: 0; translate: 0 -60px; } }
  @media (prefers-reduced-motion: reduce) { .blocks li { animation: none; transition: none; } }
</style>
</head>
<body>
  <div class="moon" aria-hidden="true"></div>
  <main>
    <ul class="blocks" aria-label="littleone">
      <li style="--i:0">l</li><li class="dot" style="--i:1">i</li><li style="--i:2">t</li>
      <li style="--i:3">t</li><li style="--i:4">l</li><li style="--i:5">e</li>
      <li class="face" style="--i:6" aria-hidden="true"></li><li style="--i:7">n</li><li style="--i:8">e</li>
    </ul>
    <h1>We're building something new</h1>
    <p class="lead">Our website is under construction. Please check back soon.</p>
    <div class="contact">
      <p><span>Email</span> <a href="mailto:rozanfirnaz@hotmail.com">rozanfirnaz@hotmail.com</a></p>
      <p><span>Mobile</span> <a href="tel:+94787446677">+94 78 744 6677</a></p>
    </div>
  </main>
</body>
</html>
